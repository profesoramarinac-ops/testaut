name: Java CI (Automatización Total)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar código del alumno
      uses: actions/checkout@v4

    - name: 2. Instalar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ESTA ES LA MAGIA: Descargamos JUnit directo de internet a la máquina virtual
    - name: 3. Descargar JUnit Standalone dinámicamente
      run: |
        curl -L -o junit-platform-console-standalone.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.0/junit-platform-console-standalone-1.10.0.jar

    - name: 4. Compilar todo el proyecto (.java)
      run: |
        mkdir -p bin
        # Buscamos en todo el proyecto (.) ignorando la carpeta bin
        javac -d bin -cp "junit-platform-console-standalone.jar" $(find . -name "*.java" ! -path "./bin/*")

    - name: 5. Ejecutar Pruebas de JUnit
      run: |
        java -jar junit-platform-console-standalone.jar --class-path bin --scan-class-path